<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ApertureDB HTTP example</title>
    <script src="rest_api.js" defer></script>
</head>
<body>
    <h1>ApertureDB HTTP example</h1>
    <form id="connect">
        <label>API URL <input id="endpoint" value="/api/" required></label>
        <label>Username <input id="username" value="admin" autocomplete="username" required></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">Connect</button>
    </form>
    <form id="addimage" enctype="multipart/form-data">
        <label>Image class <input id="imageclass" value="RestExampleImage" required></label>
        <label>Image <input id="fileupload" type="file" accept="image/*" required></label>
        <button type="submit" disabled>Upload image</button>
    </form>
    <pre id="output" aria-live="polite"></pre>
    <div id="preview"></div>
</body>
</html>
