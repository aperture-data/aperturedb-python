# initcommand.sh starts the database stack (test/stack.sh). The development
# container joins its network, where the database is lenz:55551 and the REST
# API is https://http-proxy:8443/api/.
services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DB_HOST: lenz
      DB_PORT: 55551
      CA_CERT: /ca/ca.crt
    command: bash -c "while true; do sleep 1000; done"
    volumes:
      - ../:/aperturedb-python
      - ../test/aperturedb/aperturedb-python-dev/ca:/ca:ro

networks:
  default:
    name: aperturedb-python-dev_default
    external: true
