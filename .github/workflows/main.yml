name: main

on:
  push:
    branches:
      - main

# Main only publishes the latest commit; cancel any in-flight run when a newer
# push lands so we don't waste an hour racing against ourselves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on:
    - self-hosted
    - X64

    steps:

    - uses: actions/checkout@v4

    - name: Initialize modern stack identity receipt
      if: always()
      run: |
        mkdir -p qualification
        printf '%s\n' '{"schema_version":2,"state":"not_run","service":"aperturedb"}' > qualification/sdk-modern-stack.json
      shell: bash

    - name: Check modern stack receipt controls
      run: python3 -m unittest discover -s test -p 'modern_stack_receipt_checks.py' -v
      shell: bash

    - name: Check release publication controls
      run: python3 -m unittest discover -s test -p 'release_publication_checks.py' -v
      shell: bash

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ fromJson(secrets.DOCKERHUB).username }}
        password: ${{ fromJson(secrets.DOCKERHUB).password }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ secrets.GCP_SERVICE_ACCOUNT_PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Set up Docker Compose
      # Starting a stack from a Compose artifact (oci://) needs a recent Compose.
      uses: docker/setup-compose-action@v1
      with:
        version: v2.40.3

    - name: Build and Run Tests
      env:
        AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        RUNNER_NAME: ${{ runner.name }}_main
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
        ADB_COMPOSE: oci://aperturedata/aperturedb-compose-single-node:latest
      run: RUN_TESTS=true ./ci.sh
      shell: bash

    - name: Require captured modern stack identity
      run: python3 test/require_modern_stack.py qualification/sdk-modern-stack.json --expected-image "$(cat qualification/sdk-selected-image)" --expected-branch main
      shell: bash

    - name: Upload modern stack identity receipt
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sdk-modern-stack-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          qualification/sdk-modern-stack.json
          qualification/sdk-selected-image
          qualification/sdk-compat/junit.xml
        if-no-files-found: error

  publish_release:
    needs:
    - build_and_test

    runs-on:
    - self-hosted
    - X64

    steps:

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ fromJson(secrets.DOCKERHUB).username }}
        password: ${{ fromJson(secrets.DOCKERHUB).password }}

    - name: Build Notebook
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        RUNNER_NAME: ${{ runner.name }}
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
      run: BUILD_COMPLETE=true ./ci.sh
      shell: bash

    - name: Tag release version
      run: './tag.sh'
      shell: bash

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: oras-project/setup-oras@v1
      with:
        version: '1.3.0'
    - name: Publish versioned SDK wheel
      run: bash publish.sh
      shell: bash

    - name: GitHub Release
      run: 'TOKEN=${{ secrets.GITHUBPAT }} ./github-release.sh'
      shell: bash

    - name: Publish docs content image
      run: |
        source version.sh
        read_version
        docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -f docs-content/Dockerfile -t "aperturedata/aperturedb-python-docs:$BUILD_VERSION" .
        docker push "aperturedata/aperturedb-python-docs:$BUILD_VERSION"
      shell: bash

    - name: Update SDK component version in infra
      env:
        GH_TOKEN: ${{ secrets.PAT_INFRA }}
      run: |
        source version.sh
        read_version
        jq -n --arg tag "$BUILD_VERSION" \
          '{event_type:"update-tag",client_payload:{component:"aperturedb-python",tag:$tag}}' \
          | curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @- \
              https://api.github.com/repos/aperture-data/infra/dispatches
      shell: bash
