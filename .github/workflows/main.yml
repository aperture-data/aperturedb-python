name: main

on:
  push:
    branches:
      - main

# Main only publishes the latest commit; cancel any in-flight run when a newer
# push lands so we don't waste an hour racing against ourselves.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    runs-on:
    - benchmark

    steps:

    - uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ fromJson(secrets.DOCKERHUB).username }}
        password: ${{ fromJson(secrets.DOCKERHUB).password }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ secrets.GCP_SERVICE_ACCOUNT_PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Build and Run Tests
      env:
        # Single job runs both protocols in parallel via run_test_container.sh
        # rather than spinning up two matrix runners that each rebuild every
        # docker image.
        TEST_PROTOCOL: both
        AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        RUNNER_NAME: ${{ runner.name }}_main
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
        ADB_REPO: aperturedata/aperturedb
        ADB_TAG: dev
        LENZ_REPO: aperturedata/lenz
        LENZ_TAG: dev
      run: RUN_TESTS=true ./ci.sh
      shell: bash

  build_notebooks_and_publish_pypi:
    needs:
    - build_and_test

    runs-on:
    - benchmark

    steps:

    - uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ fromJson(secrets.DOCKERHUB).username }}
        password: ${{ fromJson(secrets.DOCKERHUB).password }}

    - name: Build Notebook
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        RUNNER_NAME: ${{ runner.name }}
        DOCKER_BUILDKIT: 1
        COMPOSE_DOCKER_CLI_BUILD: 1
        ADB_REPO: aperturedata/aperturedb
        ADB_TAG: dev
        LENZ_REPO: aperturedata/lenz
        LENZ_TAG: dev
      run: BUILD_COMPLETE=true ./ci.sh
      shell: bash

    - name: Publish to PyPi
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        bash publish.sh

    - name: Tag release version
      run: './tag.sh'
      shell: bash

    - name: GitHub Release
      run: 'TOKEN=${{ secrets.GITHUBPAT }} ./github-release.sh'
      shell: bash

    - name: Publish docs content image
      run: |
        source version.sh
        read_version
        docker build -f docs-content/Dockerfile -t "aperturedata/aperturedb-python-docs:v$BUILD_VERSION" .
        docker push "aperturedata/aperturedb-python-docs:v$BUILD_VERSION"
      shell: bash

    - name: Update docs provider version in infra
      env:
        GH_TOKEN: ${{ secrets.PAT_INFRA }}
      run: |
        source version.sh
        read_version
        jq -n --arg tag "v$BUILD_VERSION" \
          '{event_type:"update-tag",client_payload:{environment:"develop",component:"python-client",tag:$tag}}' \
          | curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              --data-binary @- \
              https://api.github.com/repos/aperture-data/infra/dispatches
      shell: bash

  trigger_demos_buils:
    runs-on: ubuntu-latest
    needs:
      - build_notebooks_and_publish_pypi
    steps:
    - uses: actions/checkout@v3
    - name: repository dispatch
      run: |
        curl -X POST https://api.github.com/repos/aperture-data/demos/actions/workflows/13727133/dispatches \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer ${{ secrets.GITHUBPAT }}" \
        -H "X-GitHub-Api-Version: 2022-11-28" \
        -d '{"ref":"main","inputs":{}}'

      shell: bash
