name: release

on:
  push:
    branches:
    - release*

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        protocol: [http, non_http]

    runs-on:
    - self-hosted
    - deployer

    steps:

    - name: Cleanup previous run
      run: docker run --rm -v ${{ github.workspace }}:/workspace alpine sh -c "rm -rf /workspace/test/aperturedb/db* /workspace/test/aperturedb/logs"
      continue-on-error: true

    - uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        project_id: ${{ secrets.GCP_SERVICE_ACCOUNT_PROJECT_ID }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Build and Run Tests
      env:
        TEST_PROTOCOL: ${{ matrix.protocol }}
        AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_DEFAULT_REGION:    ${{ secrets.AWS_DEFAULT_REGION }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        RUNNER_NAME: ${{ runner.name }}_${{ matrix.protocol }}
      run: RUN_TESTS=true NO_PUSH=true UPDATE_BRANCH=true ./ci.sh
      shell: bash

  build_and_deploy_docs:

    runs-on:
    - self-hosted
    - deployer

    steps:

    - name: Cleanup previous run
      run: docker run --rm -v ${{ github.workspace }}:/workspace alpine sh -c "rm -rf /workspace/test/aperturedb/db* /workspace/test/aperturedb/logs"
      continue-on-error: true

    - uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USER }}
        password: ${{ secrets.DOCKER_PASS }}

    - name: Build Notebook Docker
      run: BUILD_COMPLETE=true NO_PUSH=true ./ci.sh
      shell: bash
